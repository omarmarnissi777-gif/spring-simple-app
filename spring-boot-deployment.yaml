apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-simple-app
  labels:
    app: spring-simple-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-simple-app
  template:
    metadata:
      labels:
        app: spring-simple-app
    spec:
      containers:
      - name: spring-simple-app
        image: jetza99/spring-simple-app:latest
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: spring-simple-app-service
spec:
  selector:
    app: spring-simple-app
  type: NodePort
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
    nodePort: 32000
